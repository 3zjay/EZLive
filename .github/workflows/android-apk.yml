name: Build EZLiveStudio Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout EZLive Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 21 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install NPM Dependencies & Sync Capacitor Android
        run: |
          npm install
          npx cap sync android

      - name: Build Installable Android APK (Debug / Sideload Ready)
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare Versioned and Latest APK Releases
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk EZLiveStudio.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk EZLiveStudio-v1.2.0.apk

      - name: Upload EZLiveStudio.apk Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EZLiveStudio-Android-APK
          path: |
            EZLiveStudio.apk
            EZLiveStudio-v1.2.0.apk
          retention-days: 90

      - name: Publish Latest APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest-apk
          name: "EZLiveStudio by HoopCulture — Android APK v1.2.0 (Build 12)"
          body: |
            ### 🏀 EZLiveStudio Official Android APK Release
            - **App Version**: `v1.2.0` (Build 12)
            - **Engine**: Direct On-Device Native RTMP/RTMPS Engine (FFmpeg-Kit) with zero cloud relay required.
            - **Cloud Sync**: Streamlabs-style cross-device profile sync for Facebook Live & YouTube Live destinations.

            #### Download Links:
            - **[EZLiveStudio.apk (Latest)](https://github.com/3zjay/EZLive/releases/download/latest-apk/EZLiveStudio.apk)**
            - **[EZLiveStudio-v1.2.0.apk (v1.2.0 Build 12)](https://github.com/3zjay/EZLive/releases/download/latest-apk/EZLiveStudio-v1.2.0.apk)**
          files: |
            EZLiveStudio.apk
            EZLiveStudio-v1.2.0.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
