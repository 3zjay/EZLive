  <script>
    // Global Storage Shield — prevents WebKit SecurityError exceptions on blocked localStorage/sessionStorage
    (function() {
      try {
        localStorage.setItem('__test_ls__', '1');
        localStorage.removeItem('__test_ls__');
      } catch (e) {
        console.warn("localStorage is blocked. Injecting in-memory fallback.");
        var store = {};
        Object.defineProperty(window, 'localStorage', {
          value: {
            getItem: function(k) { return store[k] === undefined ? null : store[k]; },
            setItem: function(k, v) { store[k] = String(v); },
            removeItem: function(k) { delete store[k]; },
            clear: function() { store = {}; },
            key: function(i) { return Object.keys(store)[i] || null; },
            get length() { return Object.keys(store).length; }
          },
          configurable: true, writable: true
        });
      }
      try {
        sessionStorage.setItem('__test_ss__', '1');
        sessionStorage.removeItem('__test_ss__');
      } catch (e) {
        console.warn("sessionStorage is blocked. Injecting in-memory fallback.");
        var store = {};
        Object.defineProperty(window, 'sessionStorage', {
          value: {
            getItem: function(k) { return store[k] === undefined ? null : store[k]; },
            setItem: function(k, v) { store[k] = String(v); },
            removeItem: function(k) { delete store[k]; },
            clear: function() { store = {}; },
            key: function(i) { return Object.keys(store)[i] || null; },
            get length() { return Object.keys(store).length; }
          },
          configurable: true, writable: true
        });
      }
    })();
  </script>

<script>
/* ══ CONFIG ══ */
const isLocalServer = window.location.hostname === 'localhost' ||
                      window.location.hostname === '127.0.0.1' ||
                      window.location.hostname.startsWith('192.168.') ||
                      window.location.hostname.startsWith('10.');

const useFB = (typeof isFirebaseConfigured !== 'undefined' && isFirebaseConfigured);

const SRV = useFB
  ? 'https://basketball-scoreboard-o0c7.onrender.com'
  : (window.location.protocol === 'file:' ? 'http://localhost:3000' : '');

let db=null;
if(useFB&&typeof isFirebaseConfigured!=='undefined'&&isFirebaseConfigured){
  firebase.initializeApp(firebaseConfig);
  db=firebase.database();
}

function gP(n){return new URLSearchParams(window.location.search).get(n);}
const CU=gP('user')||'default';
const FU=CU.replace(/[\.\#\$\[\]]/g,'_');

const PER=['1ST','2ND','3RD','4TH','OT','2OT','3OT'];

const DEF={
  homeScore:0,awayScore:0,
  homeAbbr:'HOME',awayAbbr:'AWAY',
  homeColor:'#888888',awayColor:'#c8102e',
  homeLogo:'',awayLogo:'',
  homeLogoThumb:'',awayLogoThumb:'',
  homeFouls:0,awayFouls:0,
  gameSeconds:600,clockRunning:false,
  shotSeconds:24,shotRunning:false,
  quarter:1,
  rp1Title:'BROADCAST',rp1Value:'',
  rp2Title:'VENUE',rp2Value:'',
  aiSyncEnabled:true
};

let S={...DEF};
let aiSyncActive = false;
let aiState = { gameSeconds: null, clockStr: null, homeScore: null, awayScore: null, quarter: null, shotSeconds: null };
let lH=-1,lA=-1,_lb=0;
let _lastLocalMsgTime=0;
let _ll=0;

function applyStreamData(data) {
  if (!data) return;
  
  if (data.streamActive === false) {
    aiSyncActive = false;
    draw();
    return;
  }
  
  if (data.streamActive === true) {
    aiSyncActive = true;
  } else if (data.clock != null || data.homeScore != null || data.awayScore != null || data.period != null || data.shotClock != null) {
    aiSyncActive = true;
  }

  if (data.clock != null) {
    const clockStr = String(data.clock).trim();
    aiState.clockStr = clockStr;
    if (clockStr.includes(':')) {
      const parts = clockStr.split(':');
      aiState.gameSeconds = (parseInt(parts[0], 10) || 0) * 60 + (parseInt(parts[1], 10) || 0);
    } else if (clockStr.length === 3) {
      aiState.gameSeconds = (parseInt(clockStr.substring(0, 1), 10) || 0) * 60 + (parseInt(clockStr.substring(1), 10) || 0);
    } else if (clockStr.length === 4) {
      aiState.gameSeconds = (parseInt(clockStr.substring(0, 2), 10) || 0) * 60 + (parseInt(clockStr.substring(2), 10) || 0);
    } else {
      const p = parseFloat(clockStr);
      if (!isNaN(p)) aiState.gameSeconds = Math.round(p);
    }
  }
  if (data.homeScore != null && !isNaN(parseInt(data.homeScore, 10))) aiState.homeScore = parseInt(data.homeScore, 10);
  if (data.awayScore != null && !isNaN(parseInt(data.awayScore, 10))) aiState.awayScore = parseInt(data.awayScore, 10);
  if (data.period != null && !isNaN(parseInt(data.period, 10))) aiState.quarter = parseInt(data.period, 10);
  if (data.shotClock != null && !isNaN(parseInt(data.shotClock, 10))) aiState.shotSeconds = parseInt(data.shotClock, 10);

  if (data.gameClockStream) S.gameClockStream = data.gameClockStream;
  if (data.homeScoreStream) S.homeScoreStream = data.homeScoreStream;
  if (data.awayScoreStream) S.awayScoreStream = data.awayScoreStream;
  if (data.periodStream) S.periodStream = data.periodStream;
  if (data.shotClockStream) S.shotClockStream = data.shotClockStream;

  draw();
}

function getEffState() {
  if (aiSyncActive) {
    return {
      ...S,
      gameSeconds: aiState.gameSeconds !== null ? aiState.gameSeconds : S.gameSeconds,
      clockStr: aiState.clockStr !== null ? aiState.clockStr : null,
      homeScore: aiState.homeScore !== null ? aiState.homeScore : S.homeScore,
      awayScore: aiState.awayScore !== null ? aiState.awayScore : S.awayScore,
      quarter: aiState.quarter !== null ? aiState.quarter : S.quarter,
      shotSeconds: aiState.shotSeconds !== null ? aiState.shotSeconds : S.shotSeconds,
    };
  }
  return S;
}

let _lastStateMsgTime = 0;

function hasStateNonClockChanged(oldS, newD) {
  if (!oldS || !newD) return true;
  for (const k of [
    'homeScore', 'awayScore', 'homeAbbr', 'awayAbbr', 'homeRecord', 'awayRecord',
    'homeColor', 'awayColor', 'homeLogo', 'awayLogo', 'homeLogoThumb', 'awayLogoThumb',
    'quarter', 'possession', 'rp1Title', 'rp1Value', 'rp2Title', 'rp2Value',
    'homeFouls', 'awayFouls'
  ]) {
    if (newD[k] !== undefined && newD[k] !== oldS[k]) return true;
  }
  return false;
}

function applyStateMessage(msgData) {
  _lastStateMsgTime = Date.now();
  _ll = Date.now();
  _lastLocalMsgTime = Date.now();
  if (!msgData) return;
  if (msgData.aiSyncActive !== undefined) aiSyncActive = !!msgData.aiSyncActive;
  if (msgData.aiSyncEnabled !== undefined) aiSyncActive = !!msgData.aiSyncEnabled;
  const nonClockChanged = hasStateNonClockChanged(S, msgData);
  S = { ...S, ...msgData };
  if (nonClockChanged) {
    draw();
  } else {
    tock();
  }
  sync();
}

function handleBCMessage(e) {
  if (!e || !e.data) return;
  if (e.data.type === 'state') {
    applyStateMessage(e.data.data);
  } else if (e.data.type === 'stream') {
    _lastLocalMsgTime = Date.now();
    applyStreamData(e.data.data);
  }
}

const bc = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('hc_scoreboard_sync') : null;
if (bc) bc.onmessage = handleBCMessage;
const bcLegacy = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('basketball_scoreboard') : null;
if (bcLegacy) bcLegacy.onmessage = handleBCMessage;
window.addEventListener('message', handleBCMessage);

function $(i){return document.getElementById(i);}
function tx(i,v){
  const e=$(i);
  const s = String(v !== undefined && v !== null ? v : '');
  if(e && e.textContent !== s) e.textContent = s;
}
function isHex(c){return/^#[0-9A-F]{6}$/i.test(c);}

/* Hex Darkener Helper */
function dk(hex, factor) {
  if (!isHex(hex)) return '#2d2d2d';
  let r = parseInt(hex.slice(1,3), 16);
  let g = parseInt(hex.slice(3,5), 16);
  let b = parseInt(hex.slice(5,7), 16);
  r = Math.floor(r * factor);
  g = Math.floor(g * factor);
  b = Math.floor(b * factor);
  return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
}

/* Light/Dark Luminance Helper */
function isLight(hex) {
  if (!isHex(hex)) return false;
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  const lum = (0.299 * r + 0.587 * g + 0.114 * b);
  return lum > 160;
}

function setLogo(cid,url){
  const c=$(cid);if(!c)return;
  if(url){
    let img=c.querySelector('img');
    if(!img){
      c.innerHTML=`<img src="${url}" alt="" style="width:100%;height:100%;object-fit:contain">`;
    } else if(img.getAttribute('src')!==url){
      img.src=url;
    }
  } else {
    if(!c.querySelector('.no-logo')){
      c.innerHTML='<div class="no-logo">LOGO</div>';
    }
  }
}
function setStacked(id,text){
  const el=$(id);if(!el)return;
  const cleanText=(text||'').trim();
  if (el.dataset.renderedText === cleanText) return;
  el.dataset.renderedText = cleanText;
  const chars=cleanText.toUpperCase().split('');
  const len=chars.length;
  
  let fontSize='0.95vw';
  let lineHeight='0.82vw';
  
  if(len>8){
    fontSize='0.36vw';
    lineHeight='0.3vw';
  }else if(len>6){
    fontSize='0.5vw';
    lineHeight='0.43vw';
  }else if(len>4){
    fontSize='0.68vw';
    lineHeight='0.58vw';
  }else if(len===4){
    fontSize='0.82vw';
    lineHeight='0.7vw';
  }
  
  el.style.fontSize=fontSize;
  el.style.lineHeight=lineHeight;
  el.innerHTML=chars.map(c=>`<span>${c}</span>`).join('');
}

function renderStreamOrText(elId, streamImgUrl, fallbackText, maxHeightCss) {
  const el = typeof elId === 'string' ? $(elId) : elId;
  if (!el) return;
  if (aiSyncActive && streamImgUrl) {
    let img = el.querySelector('img.stream-bin-img');
    if (!img) {
      el.innerHTML = '';
      img = document.createElement('img');
      img.className = 'stream-bin-img';
      img.style.maxHeight = maxHeightCss || '100%';
      img.style.maxWidth = '100%';
      img.style.objectFit = 'contain';
      img.style.verticalAlign = 'middle';
      img.style.filter = 'brightness(1.25) contrast(1.25)';
      img.style.borderRadius = '4px';
      img.style.border = '1px solid rgba(255, 255, 255, 0.55)';
      img.style.outline = '1px solid rgba(0, 0, 0, 0.9)';
      img.style.background = '#080c14';
      img.style.boxShadow = '0 2px 6px rgba(0, 0, 0, 0.8), inset 0 0 3px rgba(255, 255, 255, 0.2)';
      img.style.padding = '2px 4px';
      img.style.boxSizing = 'border-box';
      img.style.display = 'inline-block';
      el.appendChild(img);
    } else {
      img.style.maxHeight = maxHeightCss || '100%';
    }
    if (img.src !== streamImgUrl) {
      img.src = streamImgUrl;
    }
  } else {
    const img = el.querySelector('img.stream-bin-img');
    if (img) {
      el.innerHTML = '';
    }
    const txt = (fallbackText !== null && fallbackText !== undefined) ? String(fallbackText) : '';
    if (el.children.length === 0 && el.textContent !== txt) {
      el.textContent = txt;
    }
  }
}

/* ══ CLOCK ══ */
function tock(){
  const eff = getEffState();
  let v = '';
  if (aiSyncActive && eff.clockStr) {
    v = eff.clockStr;
  } else {
    const s = eff.gameSeconds, m = Math.floor(s/60), sec = s%60;
    v = s < 60 ? `${s}.0` : `${m}:${sec.toString().padStart(2,'0')}`;
  }
  renderStreamOrText('clk', S.gameClockStream, v, '1.6vw');
  const e=$('clk');
  if(e){
    const targetWarn = eff.gameSeconds<=30;
    if(e.classList.contains('warn') !== targetWarn) e.classList.toggle('warn', targetWarn);
  }

  const scText = eff.shotSeconds != null ? eff.shotSeconds : '--';
  renderStreamOrText('sc', S.shotClockStream, scText, '0.9vw');
  const sc=$('sc');
  if(sc){
    const targetWarn = (eff.shotSeconds !== null && eff.shotSeconds<=5 && eff.shotSeconds > 0);
    if(sc.classList.contains('warn') !== targetWarn) sc.classList.toggle('warn', targetWarn);
    const targetZero = (eff.shotSeconds !== null && eff.shotSeconds === 0);
    if(sc.classList.contains('zero') !== targetZero) sc.classList.toggle('zero', targetZero);
  }
}

/* ══ DRAW ══ */
function draw(){
  const eff = getEffState();
  /* period */
  const perText = typeof eff.quarter==='number'?(eff.quarter===0?PER[0]:PER[eff.quarter-1]||`Q${eff.quarter}`):eff.quarter;
  renderStreamOrText('per', S.periodStream, perText, '0.9vw');
  tock();

  /* scores + bump */
  const hE=$('hNum'),aE=$('aNum');
  renderStreamOrText('hNum', S.homeScoreStream, eff.homeScore, '2.6vw');
  renderStreamOrText('aNum', S.awayScoreStream, eff.awayScore, '2.6vw');
  if(hE && lH >= 0 && lH !== eff.homeScore){hE.classList.remove('bump');void hE.offsetWidth;hE.classList.add('bump');}
  if(aE && lA >= 0 && lA !== eff.awayScore){aE.classList.remove('bump');void aE.offsetWidth;aE.classList.add('bump');}
  lH=eff.homeScore;lA=eff.awayScore;

  /* abbr — max 4 chars stacked vertically */
  setStacked('hAbbr', S.homeAbbr || 'HOME');
  setStacked('aAbbr', S.awayAbbr || 'AWAY');

  /* fouls in brace columns */
  const hf=S.homeFouls||0,af=S.awayFouls||0;
  tx('hFouls',hf>0?String(hf):'');
  tx('aFouls',af>0?String(af):'');

  /* shot clock fouls */
  const qfn=parseInt(S.rp1Value||'');
  tx('qf',(!isNaN(qfn)&&qfn>0)?String(qfn):'');

  /* ── COLORS ── */
  const hcRaw = isHex(S.homeColor) ? S.homeColor : '#888888';
  const acRaw = isHex(S.awayColor) ? S.awayColor : '#c8102e';

  const homePrimary = hcRaw;
  const awayPrimary = acRaw;

  const hTextColor = isLight(homePrimary) ? '#111111' : '#ffffff';
  const aTextColor = isLight(awayPrimary) ? '#111111' : '#ffffff';

  const hLW=$('hLogoWrapper');
  if(hLW)hLW.style.background=dk(hcRaw, 0.58);

  const hTB=$('hTopBar');
  if(hTB)hTB.style.background=dk(hcRaw, 0.58);

  const aTB=$('aTopBar');
  if(aTB)aTB.style.background=dk(acRaw, 0.58);

  const aLW=$('aLogoWrapper');
  if(aLW)aLW.style.background=dk(acRaw, 0.58);

  const hBrace = $('hBraceCol');
  if(hBrace){
    hBrace.style.background=homePrimary;
    hBrace.style.color=hTextColor;
  }
  const hScore = $('hScoreSeg');
  if(hScore){
    hScore.style.background=homePrimary;
    hScore.style.color=hTextColor;
  }

  const aBrace = $('aBraceCol');
  if(aBrace){
    aBrace.style.background=awayPrimary;
    aBrace.style.color=aTextColor;
  }
  const aScore = $('aScoreSeg');
  if(aScore){
    aScore.style.background=awayPrimary;
    aScore.style.color=aTextColor;
  }

  setLogo('hCircle',S.homeLogo || S.homeLogoThumb);
  setLogo('aCircle',S.awayLogo || S.awayLogoThumb);

  const bcVal = (S.rp1Value || '').trim();
  const vnLabel = (S.rp2Title || 'VENUE').trim();
  const vnVal = (S.rp2Value || '').trim();

  const cleanBc = (bcVal === '—' || bcVal === '-') ? '' : bcVal;
  const cleanVn = (vnVal === '—' || vnVal === '-') ? '' : vnVal;

  const dotEl = document.getElementById('live-dot');
  const txtEl = document.getElementById('strip-text');

  if (txtEl) {
    let targetHtml = '';
    if (cleanBc) {
      if (dotEl) dotEl.style.display = 'inline-block';
      targetHtml = `LIVE: ${cleanBc}`;
      if (cleanVn) {
        targetHtml += ` &nbsp;&nbsp;&bull;&nbsp;&nbsp; ${vnLabel}: <span class="venue-highlight">${cleanVn}</span>`;
      }
    } else {
      if (dotEl) dotEl.style.display = 'none';
      if (cleanVn) {
        targetHtml = `${vnLabel}: <span class="venue-highlight">${cleanVn}</span>`;
      } else {
        targetHtml = 'HOOP CULTURE NETWORK';
      }
    }
    if (txtEl.dataset.renderedHtml !== targetHtml) {
      txtEl.dataset.renderedHtml = targetHtml;
      txtEl.innerHTML = targetHtml;
    }
  }
}

/* ══ TIMER & LOCAL TICK ══ */
let tT=null,sT=null;
function sync(){
  clearInterval(tT);clearInterval(sT);
  if(S.gameRunning){
    tT=setInterval(()=>{
      if(Date.now() - _lastStateMsgTime < 3000) return;
      if(S.gameSeconds>0){S.gameSeconds--;tock();}else{clearInterval(tT);gbuzz();}
    },1000);
  }
  if(S.shotRunning){
    sT=setInterval(()=>{
      if(Date.now() - _lastStateMsgTime < 3000) return;
      if(S.shotSeconds>0){S.shotSeconds--;tock();}else{clearInterval(sT);sbuzz();}
    },1000);
  }
}
function stop(){clearInterval(tT);clearInterval(sT);}

/* ══ AUDIO ══ */
const _gameBuzzer = new Audio('/buzzer.mp3');
_gameBuzzer.volume = 1.0;
_gameBuzzer.load();

const _shotBuzzer = new Audio('/buzzer.mp3');
_shotBuzzer.volume = 1.0;
_shotBuzzer.load();

window.addEventListener('load', () => {
  [_gameBuzzer, _shotBuzzer].forEach(a => {
    a.play().then(() => { a.pause(); a.currentTime = 0; }).catch(() => {});
  });
});

function gbuzz(){ _gameBuzzer.currentTime = 0; _gameBuzzer.play().catch(()=>{}); }
function sbuzz(){ _shotBuzzer.currentTime = 0; _shotBuzzer.play().catch(()=>{}); }

/* ══ CONNECT ══ */
function conn(){
  if(useFB&&db){
    db.ref(`states/${FU}`).on('value',sn=>{
      if(Date.now()-_ll<2000)return;
      const d=sn.val();
      if(!d)return;
      applyStateMessage(d);
    });
    db.ref(`ocr/${FU}`).on('value',sn=>{const d=sn.val();if(d)applyStreamData(d);});
    db.ref(`buzz/${FU}`).on('value',sn=>{if(Date.now()-_ll<2000)return;const m=sn.val();if(!m||m.timestamp<=_lb)return;_lb=m.timestamp;m.kind==='game'?gbuzz():sbuzz();});
    return;
  }
  const es=new EventSource(`${SRV}/events?user=${encodeURIComponent(CU)}`);
  es.onmessage=e=>{
    try{
      const m=JSON.parse(e.data);
      if(m.type==='buzz'){
        m.kind==='game'?gbuzz():sbuzz();
      } else if(m.type==='state'){
        applyStateMessage(m.data);
      } else if(m.type==='stream'){
        applyStreamData(m.data);
      }
    }catch(err){}
  };
  es.onerror=()=>{es.close();setTimeout(conn,2000);};
}
if(useFB&&db){
  draw();
  db.ref(`states/${FU}`).once('value').then(sn=>{const d=sn.val();if(d){S={...DEF,...d};draw();sync();}}).catch(()=>{}).finally(()=>conn());
}
else{draw();fetch(`${SRV}/state?user=${encodeURIComponent(CU)}`).then(r=>r.json()).then(d=>{if(Object.keys(d).length){S={...DEF,...d};draw();sync();}}).catch(()=>{}).finally(()=>conn());}
</script>
