<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b1a" />
      <stop offset="50%" stop-color="#e8430a" />
      <stop offset="100%" stop-color="#c8841a" />
    </linearGradient>
    <radialGradient id="courtGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b1a" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#080605" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="512" height="512" rx="120" fill="#080605" />
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="url(#fireGrad)" stroke-width="6" opacity="0.8" />
  <circle cx="256" cy="235" r="170" fill="url(#courtGlow)" />
  
  <!-- Outer Basketball Ring -->
  <circle cx="256" cy="235" r="115" fill="#140f0c" stroke="url(#fireGrad)" stroke-width="12" />
  
  <!-- Basketball Seams -->
  <line x1="141" y1="235" x2="371" y2="235" stroke="#e8430a" stroke-width="6" stroke-linecap="round" />
  <line x1="256" y1="120" x2="256" y2="350" stroke="#e8430a" stroke-width="6" stroke-linecap="round" />
  <path d="M 175 155 Q 230 235 175 315" fill="none" stroke="#e8430a" stroke-width="5" stroke-linecap="round" />
  <path d="M 337 155 Q 282 235 337 315" fill="none" stroke="#e8430a" stroke-width="5" stroke-linecap="round" />

  <!-- Center Live Broadcast Signal -->
  <circle cx="256" cy="235" r="32" fill="#e8430a" />
  <circle cx="256" cy="235" r="14" fill="#ffffff" />

  <!-- Broadcast Signal Arcs -->
  <path d="M 110 160 A 150 150 0 0 1 110 310" fill="none" stroke="#ff6b1a" stroke-width="12" stroke-linecap="round" />
  <path d="M 402 160 A 150 150 0 0 0 402 310" fill="none" stroke="#ff6b1a" stroke-width="12" stroke-linecap="round" />

  <!-- Brand Typography -->
  <text x="256" y="420" font-family="'Barlow Condensed', 'Anton', sans-serif" font-weight="900" font-size="40" fill="#f2ede8" text-anchor="middle" letter-spacing="6">EZ LIVE STUDIO</text>
  <text x="256" y="458" font-family="'Barlow', sans-serif" font-weight="700" font-size="20" fill="#ff6b1a" text-anchor="middle" letter-spacing="4">BY HOOP CULTURE</text>
